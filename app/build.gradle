plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.carplus.registro'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.carplus.registro'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('carplus.jks')
            storePassword 'carplus2026'
            keyAlias 'carplus'
            keyPassword 'carplus2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
